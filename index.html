<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>텃밭 채소를 부탁해 · 운영 중지</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥬</text></svg>">
<style>
:root{--bg:#f4f6f2;--card:#fff;--fg:#1f2a1c;--muted:#5d6b58;--line:#d9e0d4;--accent:#3f7a2e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a12;--card:#1c241a;--fg:#e5ece1;--muted:#a1ae9b;--line:#2d382a;--accent:#8cc97a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.7;word-break:keep-all;padding:24px 16px}
main{max-width:440px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.icon{font-size:40px;line-height:1}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted)}
b{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">🥬</div>
  <h1>지금은 쓸 수 없는 앱입니다</h1>
  <p>‘텃밭 채소를 부탁해’는 <b>운영을 멈췄습니다.</b> 재료 인식과 레시피 추천 기능이 모두 꺼져 있습니다.</p>
  <p>다시 열면 선생님이 알려 드릴게요.</p>
</main>
</body>
</html>
